name: zhishu

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  elasticsearch:
    image: elasticsearch:8.10.4
    container_name: zhishu-es
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${ZHISHU_ES_MEM_LIMIT:-1400m}
    environment:
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      node.name: zhishu-es01
      cluster.name: zhishu-es-cluster
      discovery.type: single-node
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms${ZHISHU_ES_HEAP:-768m} -Xmx${ZHISHU_ES_HEAP:-768m}
    ports:
      - "127.0.0.1:${ZHISHU_ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    command: >
      bash -c "
      if ! elasticsearch-plugin list | grep -q 'analysis-ik'; then
        echo 'Installing analysis-ik plugin...';
        elasticsearch-plugin install --batch https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-8.10.4.zip;
      else
        echo 'analysis-ik plugin already installed.';
      fi;
      exec /usr/local/bin/docker-entrypoint.sh
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  kafka:
    image: apache/kafka:3.9.0
    container_name: zhishu-kafka
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${ZHISHU_KAFKA_MEM_LIMIT:-512m}
    ports:
      # ✅ 仅绑定 127.0.0.1，防止公网暴露
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-536870912}
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - ../data/kafka:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: zhishu-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${ZHISHU_BACKEND_MEM_LIMIT:-768m}
    env_file:
      - ../.env
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8081}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=20.0}
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SERVER_PORT:-8081}/api/v1/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "127.0.0.1:${ZHISHU_BACKEND_PORT:-8080}:${SERVER_PORT:-8081}"
    volumes:
      - ../logs:/app/logs

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: zhishu-frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3080:80"

volumes:
  es-data:
  es-plugins:
