# ZH-F02 experiment profile — 分片上传有界并发实验采集专用
# 后端零改 (生产代码不变); 变量在前端/harness 并发度 (baseline 串行 / after 2/4/8)。
# backend 已幂等 + 租户隔离, 支持并发 chunk; 此 profile 仅隔离配置 (port/schema/redis db/bucket)。
# 不含任何生产密钥; 脱敏快照在 G4 冻结时生成 sanitizedEnvSha256。
# 独立 redis database 15 (ZH-F05 用 14; ZH-F07 已闭环, 复用 15, 采集前 FLUSHDB)。

server:
  port: 18083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zhishu_exp_f02?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8
    username: root
    password: ZhaoYang1314.
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  data:
    redis:
      host: 192.168.241.128
      port: 6379
      password: ZhaoYang1314.
      database: 15
  kafka:
    enabled: true
    bootstrap-servers: 127.0.0.1:9092
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: zhishu-exp
  publicUrl: http://localhost:9000

jwt:
  secret-key: XeJw0yUoFDJWSNbWYFVEIXGfO8XgHrQLrIkKci5J9eA=

admin:
  bootstrap:
    username: admin
    password: ZhiShu2026Admin
    primary-org: default
    org-tags: default,admin

app:
  auth:
    registration:
      mode: INVITE_ONLY

security:
  allowed-origins: http://localhost:*,http://127.0.0.1:*

elasticsearch:
  init:
    enabled: false

wx:
  pay:
    enable: false

# ZH-F02 实验: 变量在前端/harness 并发度, 后端无 arm 切换; feature 仅为标识
# baseline = harness 串行 for-await (复现当前生产); after = harness 有界并发 pool (复现补丁后生产)
# merge 端 kafkaTemplate.executeInTransaction 非 try-catch → Kafka 必须在线 (R6), 否则 merge 500
# hikari maximum-pool-size=20 (f05 为 10): f02 并发 chunk 多请求, 留余量 (R4)
zhishu:
  experiment:
    feature: ZH-F02

logging:
  level:
    org.springframework.web: WARN
    org.springframework.boot.autoconfigure.web.servlet: WARN
    org.springframework.security: WARN
    com.canggo.zhishu: INFO
    io.minio: WARN
    org.hibernate.SQL: WARN
    org.apache.tika: WARN
